# Run configuration (S1). Prices verified 2026-11-13 from
# https://api-docs.deepseek.com/quick_start/pricing  (USD per 1M tokens)
tau2_commit: c06b07dd7c4d4ec61ba6ff9bcdf0b15dd7ef36d4
domain: retail

split:
  dev_size: 14            # D3.3: 60 train / 14 dev (from official 74 train) / 40 test
  seed: 20261113
  path: data/splits/retail_split.json

teacher:                  # C2
  model: deepseek/deepseek-flash
  default_variant: base
  variants:               # compared in the S1 retry (approved 2026-11-14)
    base:                 # D3.1 as first built: non-thinking, no prompted rationale
      agent: llm_agent
      allow_reasoning: false
      llm_args: {temperature: 0.7, extra_body: {thinking: {type: disabled}}}
    rationale:            # (a) non-thinking + one-sentence rationale before each tool call
      agent: rationale_llm_agent
      allow_reasoning: false
      llm_args: {temperature: 0.7, extra_body: {thinking: {type: disabled}}}
    thinking:             # (b) DeepSeek thinking mode (temperature is not applicable)
      agent: llm_agent
      allow_reasoning: true
      llm_args: {extra_body: {thinking: {type: enabled}}}
    thinking_rationale:   # hard-task rerun (approved 2026-11-14): thinking + one-sentence rationale prompt
      agent: rationale_llm_agent
      allow_reasoning: true
      llm_args: {extra_body: {thinking: {type: enabled}}}

student:                  # I1/D3.0; tokenizer+template files only are in data/student_tok
  model: CohereLabs/tiny-aya-en-thinker
  tokenizer_dir: data/student_tok
  max_len: 32768
  generation: {max_new_tokens: 1024, do_sample: false, dtype: float16}   # B0 and S2 share these (P1)

user_sim:                 # D3.2
  model: deepseek/deepseek-flash
  llm_args:
    temperature: 0.0      # tau2 default for the user simulator
    extra_body: {thinking: {type: disabled}}

episodes:
  K_teacher: 6            # D3.4
  k_eval: 3
  max_steps: 200          # tau2 default
  max_errors: 10          # tau2 default
  base_seed: 300          # tau2 default; trial t uses base_seed + t

# Reward (user-decided 2026-11-13, option B): DB check x substring COMMUNICATE
# on communicate_info, computed from tau2's evaluators; NL_ASSERTION judge not used.
reward:
  communicate_scorer: substring

prices:
  deepseek/deepseek-flash:
    off_peak: {cache_hit: 0.003, cache_miss: 0.15, output: 0.60}
    peak:     {cache_hit: 0.006, cache_miss: 0.30, output: 1.20}
  # Peak: Mon-Fri 01:00-04:00 and 06:00-10:00 UTC (Chinese public holidays not modelled -> conservative)
  peak_windows_utc: [[1, 4], [6, 10]]

budget:
  total_usd: 5.00
  slices_usd: {s1_smoke: 0.10, s3_pilot: 0.40, s4_teacher_data: 3.00, eval_teacher: 1.00, reserve: 0.50}

paths:
  raw: data/raw
  ledger: data/ledger.jsonl
